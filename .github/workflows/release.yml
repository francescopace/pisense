name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'      # Match: 2.5.0, 1.0.0, etc.
      - '[0-9]+.[0-9]+.[0-9]+-*'    # Match: 2.5.0-rc1, 2.5.0-beta, etc.

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release Source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag, changelog, version, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "Release commit is not reachable from main." >&2; exit 1; }
          python3 .github/scripts/validate_release.py --tag "${RELEASE_TAG}"

      - name: Require a successful main CI run for this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              head_sha: context.sha,
              status: "success",
              per_page: 100
            });
            const valid = response.data.workflow_runs.find((run) =>
              run.event === "push" &&
              run.head_branch === "main" &&
              run.head_sha === context.sha &&
              run.conclusion === "success"
            );
            if (!valid) {
              core.setFailed(`No successful main CI push run found for ${context.sha}.`);
            } else {
              core.info(`Release is gated by successful CI run ${valid.id}.`);
            }

  build-esphome:
    name: Build ESPHome ${{ matrix.chip }}
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            config: src/cpp/frontend/esphome/examples/espectre-esp32.yaml
          - chip: ESP32-S3
            config: src/cpp/frontend/esphome/examples/espectre-s3.yaml
          - chip: ESP32-S2
            config: src/cpp/frontend/esphome/examples/espectre-s2.yaml
          - chip: ESP32-C3
            config: src/cpp/frontend/esphome/examples/espectre-c3.yaml
          - chip: ESP32-C5
            config: src/cpp/frontend/esphome/examples/espectre-c5.yaml
          - chip: ESP32-C6
            config: src/cpp/frontend/esphome/examples/espectre-c6.yaml
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Compile
        env:
          ESPECTRE_GIT_VERSION: ${{ github.ref_name }}
        run: esphome -s component_source local -s project_version "${GITHUB_REF_NAME}" compile "${{ matrix.config }}"
      
      - name: Rename firmware files
        run: |
          mkdir -p .cache/firmware
          VERSION="${GITHUB_REF_NAME}"
          CHIP=$(echo "${{ matrix.chip }}" | tr '[:upper:]' '[:lower:]' | tr -d '-')
          find src/cpp/frontend/esphome/examples/.esphome/build -name "firmware.factory.bin" -exec cp {} .cache/firmware/ \;
          find src/cpp/frontend/esphome/examples/.esphome/build -name "firmware.ota.bin" -exec cp {} .cache/firmware/ \;
          mv ".cache/firmware/firmware.factory.bin" ".cache/firmware/espectre-esphome-${VERSION}-${CHIP}.bin"
          mv ".cache/firmware/firmware.ota.bin" ".cache/firmware/espectre-esphome-${VERSION}-${CHIP}-ota.bin"

      - name: Build ESPHome compliance artifacts
        env:
          ESPECTRE_GIT_VERSION: ${{ github.ref_name }}
        run: |
          PROJECT_DESCRIPTION="$(find src/cpp/frontend/esphome/examples/.esphome/build -path '*/build/project_description.json' -print -quit)"
          test -n "${PROJECT_DESCRIPTION}"
          for FIRMWARE in .cache/firmware/espectre-esphome-*.bin; do
            python .github/scripts/build_firmware_compliance.py \
              --frontend esphome \
              --project-description "${PROJECT_DESCRIPTION}" \
              --firmware "${FIRMWARE}" \
              --output-dir .cache/firmware
          done
      - name: Stage ESPHome firmware audit input
        run: |
          mkdir -p .cache/audit-input
          for SBOM in .cache/firmware/espectre-esphome-*-sbom.spdx.json; do
            case "${SBOM}" in *-ota-sbom.spdx.json) continue ;; esac
            cp "${SBOM}" ".cache/audit-input/${{ matrix.chip }}.spdx.json"
          done
          test -f ".cache/audit-input/${{ matrix.chip }}.spdx.json"

      - name: Upload ESPHome firmware audit input
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-firmware-esphome-${{ matrix.chip }}
          path: .cache/audit-input/${{ matrix.chip }}.spdx.json
          retention-days: 1

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          include-hidden-files: true
          name: firmware-${{ matrix.chip }}
          path: .cache/firmware/espectre-esphome-${{ github.ref_name }}-*
          retention-days: 7

  build-matter:
    name: Build Matter ${{ matrix.chip }}
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Keep dependencies and compiled objects per target. The target suffix
      # prevents parallel matrix jobs from competing to populate one cache.
      - name: Cache Matter toolchain, components, and compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/build/matter-home
            src/cpp/frontend/matter/app/managed_components
          key: matter-${{ runner.os }}-idf-v5.5-build-v3-${{ matrix.target }}-${{ hashFiles('requirements.txt', 'src/cpp/frontend/matter/app/main/idf_component.yml', 'src/cpp/frontend/matter/app/sdkconfig.defaults*') }}
          restore-keys: |
            matter-${{ runner.os }}-idf-v5.5-build-v3-${{ matrix.target }}-
            matter-${{ runner.os }}-idf-v5.5-deps-v2-

      - name: Build Matter firmware
        run: |
          mkdir -p .cache/firmware
          .github/scripts/build_matter_firmware.sh
        env:
          MATTER_TARGET: ${{ matrix.target }}
          MATTER_OUTPUT: ${{ github.workspace }}/.cache/firmware/espectre-matter-${{ github.ref_name }}-${{ matrix.target }}.bin
          MATTER_SDKCONFIG_DEFAULTS: ${{ matrix.target == 'esp32' && 'sdkconfig.defaults;sdkconfig.defaults.esp32' || '' }}

      - name: Stage Matter firmware audit input
        run: |
          mkdir -p .cache/audit-input
          cp .cache/firmware/espectre-matter-*-sbom.spdx.json ".cache/audit-input/${{ matrix.chip }}.spdx.json"

      - name: Upload Matter firmware audit input
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-firmware-matter-${{ matrix.chip }}
          path: .cache/audit-input/${{ matrix.chip }}.spdx.json
          retention-days: 1

      - name: Upload Matter firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          include-hidden-files: true
          name: firmware-matter-${{ matrix.chip }}
          path: .cache/firmware/espectre-matter-*
          retention-days: 7

  build-native:
    name: Build native ${{ matrix.chip }}
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3
          - chip: ESP32-S2
            target: esp32s2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The cached home contains target-independent Python and component dependencies.
      - name: Cache native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/build/native-home
          key: native-${{ runner.os }}-idf-v5.5-deps-v2-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            native-${{ runner.os }}-idf-v5.5-deps-v2-

      - name: Build native firmware
        run: |
          mkdir -p .cache/firmware
          bash .github/scripts/build_native_firmware.sh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_OUTPUT: ${{ github.workspace }}/.cache/firmware/espectre-native-${{ github.ref_name }}-${{ matrix.target }}.bin
          NATIVE_OTA_OUTPUT: ${{ github.workspace }}/.cache/firmware/espectre-native-${{ github.ref_name }}-${{ matrix.target }}-ota.bin
          NATIVE_SDKCONFIG_DEFAULTS: ${{ matrix.target == 'esp32' && 'sdkconfig.defaults;sdkconfig.defaults.esp32' || '' }}

      - name: Stage native firmware audit input
        run: |
          mkdir -p .cache/audit-input
          for SBOM in .cache/firmware/espectre-native-*-sbom.spdx.json; do
            case "${SBOM}" in *-ota-sbom.spdx.json) continue ;; esac
            cp "${SBOM}" ".cache/audit-input/${{ matrix.chip }}.spdx.json"
          done
          test -f ".cache/audit-input/${{ matrix.chip }}.spdx.json"

      - name: Upload native firmware audit input
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-firmware-native-${{ matrix.chip }}
          path: .cache/audit-input/${{ matrix.chip }}.spdx.json
          retention-days: 1

      - name: Upload native firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          include-hidden-files: true
          name: firmware-native-${{ matrix.chip }}
          path: .cache/firmware/espectre-native-*
          retention-days: 7

  audit-esphome:
    name: Audit ESPHome firmware dependencies
    needs: build-esphome
    if: always()
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt

      - name: Download firmware audit inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: audit-firmware-esphome-*
          path: .cache/audit-input
          merge-multiple: true

      - name: Audit ESPHome firmware dependencies
        run: |
          python .github/scripts/audit_firmware_dependencies.py \
            --frontend esphome \
            --sbom .cache/audit-input/*.spdx.json \
            --expected-target ESP32 \
            --expected-target ESP32-S2 \
            --expected-target ESP32-S3 \
            --expected-target ESP32-C3 \
            --expected-target ESP32-C5 \
            --expected-target ESP32-C6 \
            --output-dir .cache/reports/firmware/esphome

      - name: Summarize firmware audit
        if: always()
        run: |
          if [ -f .cache/reports/firmware/esphome/summary.md ]; then
            cat .cache/reports/firmware/esphome/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Firmware dependency audit did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload firmware vulnerability alerts
        if: always() && hashFiles('.cache/reports/firmware/esphome/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: .cache/reports/firmware/esphome/results.sarif
          category: firmware/esphome

  audit-matter:
    name: Audit Matter firmware dependencies
    needs: build-matter
    if: always()
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt

      - name: Download firmware audit inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: audit-firmware-matter-*
          path: .cache/audit-input
          merge-multiple: true

      - name: Audit Matter firmware dependencies
        run: |
          python .github/scripts/audit_firmware_dependencies.py \
            --frontend matter \
            --sbom .cache/audit-input/*.spdx.json \
            --expected-target ESP32 \
            --expected-target ESP32-C3 \
            --expected-target ESP32-C5 \
            --expected-target ESP32-C6 \
            --expected-target ESP32-S3 \
            --output-dir .cache/reports/firmware/matter

      - name: Summarize firmware audit
        if: always()
        run: |
          if [ -f .cache/reports/firmware/matter/summary.md ]; then
            cat .cache/reports/firmware/matter/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Firmware dependency audit did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload firmware vulnerability alerts
        if: always() && hashFiles('.cache/reports/firmware/matter/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: .cache/reports/firmware/matter/results.sarif
          category: firmware/matter

  audit-native:
    name: Audit Native firmware dependencies
    needs: build-native
    if: always()
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt

      - name: Download firmware audit inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: audit-firmware-native-*
          path: .cache/audit-input
          merge-multiple: true

      - name: Audit Native firmware dependencies
        run: |
          python .github/scripts/audit_firmware_dependencies.py \
            --frontend native \
            --sbom .cache/audit-input/*.spdx.json \
            --expected-target ESP32 \
            --expected-target ESP32-C3 \
            --expected-target ESP32-C5 \
            --expected-target ESP32-C6 \
            --expected-target ESP32-S2 \
            --expected-target ESP32-S3 \
            --output-dir .cache/reports/firmware/native

      - name: Summarize firmware audit
        if: always()
        run: |
          if [ -f .cache/reports/firmware/native/summary.md ]; then
            cat .cache/reports/firmware/native/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Firmware dependency audit did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload firmware vulnerability alerts
        if: always() && hashFiles('.cache/reports/firmware/native/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: .cache/reports/firmware/native/results.sarif
          category: firmware/native

  build-sdk:
    name: Build SDK Package
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Build SDK package
        run: |
          mkdir -p .cache/sdk
          python .github/scripts/build_sdk_package.py \
            --channel release \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --output-dir .cache/sdk \
            --commit "${GITHUB_SHA}"

      - name: Upload SDK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          include-hidden-files: true
          name: sdk-bundle
          path: |
            .cache/sdk/espectre-sdk-*.tar.gz
            .cache/sdk/espectre-sdk-*.zip
            .cache/sdk/sdk-manifest-*.json
          retention-days: 7

  release:
    name: Create Release
    needs: [build-esphome, build-matter, build-native, audit-esphome, audit-matter, audit-native, build-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      discussions: write
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Download all firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Download SDK package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-*
          path: sdk
          merge-multiple: true
      
      - name: List firmware files
        run: ls -la firmware/

      - name: List SDK files
        run: ls -la sdk/

      - name: Verify firmware matrix and build release manifests
        run: |
          python .github/scripts/build_firmware_manifest.py \
            --firmware-dir firmware \
            --output firmware/firmware-manifest-release.json \
            --channel release \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --compliance-url-prefix "https://espectre.dev/artifacts/firmware/release" \
            --require-complete-matrix

      - name: Build firmware compliance bundle
        run: |
          python .github/scripts/build_firmware_compliance_bundle.py \
            --firmware-dir firmware \
            --output-dir firmware \
            --channel release \
            --version "${GITHUB_REF_NAME}"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME}"
          
          # Extract section for this version from CHANGELOG.md
          # Matches from "## [version]" until the next "## [" or end of file
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { 
              if (found) exit
              if (index($0, "[" ver "]")) found=1
            }
            found { print }
          ' docs/CHANGELOG.md)
          
          # Extract title from first line
          # Format: "## [2.5.0] - 2026-02-08 - Title Here" or "## [2.5.0] - in progress - Title Here"
          FIRST_LINE=$(echo "$NOTES" | head -1)
          
          # Split by " - " and get the third part (title)
          # ## [2.5.0] - in progress - Title  →  parts: "[2.5.0]", "in progress", "Title"
          TITLE=$(echo "$FIRST_LINE" | awk -F ' - ' '{print $3}')
          
          # Clean up title
          TITLE=$(echo "$TITLE" | xargs)  # Trim whitespace
          
          # If no title, use generic
          if [ -z "$TITLE" ]; then
            TITLE="Release"
          fi
          
          # If no specific version found, use generic message
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/francescopace/espectre/blob/main/docs/CHANGELOG.md) for details."
            TITLE="Release"
          else
            # Remove first line (header) from body - it's already in the release title
            NOTES=$(echo "$NOTES" | tail -n +2)
          fi
          
          # Save to file for the release action
          echo "$NOTES" > release_notes.md
          
          # Save title for release name
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          
          echo "=== Release: v${VERSION} - ${TITLE} ==="
          cat release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ github.ref_name }} - ${{ steps.changelog.outputs.title }}"
          body_path: release_notes.md
          files: |
            firmware/*.bin
            firmware/firmware-compliance-*.zip
            firmware/firmware-manifest-*.json
            sdk/*.tar.gz
            sdk/*.zip
            sdk/*.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          discussion_category_name: "Announcements"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove superseded unbundled compliance assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              per_page: 100
            });
            const legacyNames = new Set(['LICENSE', 'LICENSING.md', 'THIRD_PARTY_NOTICES.md']);
            const uploadedNames = new Set(assets.map(asset => asset.name));
            if (uploadedNames.has('firmware-manifest-release.json')) {
              legacyNames.add(`firmware-manifest-${context.ref.replace('refs/tags/', '')}.json`);
            }
            const legacySuffixes = [
              '-sbom.spdx.json',
              '-THIRD_PARTY_NOTICES.txt',
              '-third-party-licenses.zip'
            ];
            for (const asset of assets) {
              const supersededOtaManifest = uploadedNames.has('firmware-manifest-release.json') &&
                /^espectre-native-ota-esp32(?:c3|c5|c6|s2|s3)?\.json$/.test(asset.name);
              if (!supersededOtaManifest && !legacyNames.has(asset.name) && !legacySuffixes.some(suffix => asset.name.endsWith(suffix))) {
                continue;
              }
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }

  publish-pages:
    name: Publish Website
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download release firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: firmware-*
          path: release-firmware
          merge-multiple: true

      - name: Download release SDK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-*
          path: release-sdk
          merge-multiple: true

      - name: Stage release web firmware
        run: |
          python .github/scripts/stage_web_firmware.py \
            --firmware-dir release-firmware \
            --output-dir docs/web/artifacts/firmware/release \
            --channel release \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --url-prefix /artifacts/firmware/release

      - name: Stage release web SDK
        run: |
          python .github/scripts/stage_web_sdk.py \
            --sdk-dir release-sdk \
            --output-dir docs/web/artifacts/sdk/release \
            --channel release

      - name: Stage published preview channel
        id: preview-assets
        uses: ./.github/actions/stage-published-web-channel
        with:
          release-tag: snapshot
          channel: preview
          firmware-output-dir: docs/web/artifacts/firmware/preview
          sdk-output-dir: docs/web/artifacts/sdk/preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Stage published develop channel
        id: develop-assets
        uses: ./.github/actions/stage-published-web-channel
        with:
          release-tag: snapshot-dev
          channel: develop
          firmware-output-dir: docs/web/artifacts/firmware/develop
          sdk-output-dir: docs/web/artifacts/sdk/develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Build and verify Pages tree
        uses: ./.github/actions/build-pages
        with:
          require-preview: ${{ steps.preview-assets.outputs.staged }}
          require-release: "true"
          require-develop: ${{ steps.develop-assets.outputs.staged }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/web

      - name: Upload deployed sitemap inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-sitemap
          path: docs/web/sitemap.xml
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    name: Deploy Website
    needs: publish-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Download deployed sitemap inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: website-sitemap
          path: deployed-website

      - name: Notify IndexNow
        run: python3 .github/scripts/notify_indexnow.py --sitemap deployed-website/sitemap.xml
