# ESPectre - ESP32-C5 Configuration
# WiFi CSI-based motion detection with Home Assistant integration
#
# TESTED: This platform is validated for HT20 CSI motion detection.
# ESP32-C5 uses the same modern CSI API as ESP32-C6 with WiFi 6 support.
# This example uses ESPHome's AUTO band default. This dual-band board can
# select 2.4 GHz or 5 GHz explicitly, but detection quality on 5 GHz is not
# characterized yet.
#
# Compatible boards:
# - ESP32-C5-DevKitC
# - ESP32-C5-DevKitM
# - Any ESP32-C5 board
#
# Provisioning:
# - Via USB: Use Improv Serial with `./espectre provision --ssid MyNetwork`
#   or any Improv Serial-compatible web flasher, such as https://espectre.dev/tools/flash/
# - Via WiFi: Connect to "ESPectre Fallback" AP and configure

substitutions:
  component_source: github # github or local
  example_config: espectre-c5.yaml

packages:
  component_source: !include espectre-source-${component_source}.yaml

esphome:
  name: espectre
  friendly_name: ESPectre
  min_version: 2026.7.0
  # Uncomment the next line if you have multiple ESPectre devices (adds MAC suffix to name)
  # name_add_mac_suffix: true
  project:
    name: francescopace.espectre
    version: ${project_version}

esp32:
  variant: ESP32C5
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# ESPectre - WiFi CSI Motion Detection
espectre:
  id: espectre_csi
  detection_algorithm: lightweight # lightweight (default) or high_accuracy
  csi_traffic_mode: internal # internal (default) or external
  traffic_generator_mode: ping # ping (default), dns (UDP), dns_tcp, or wifi_raw; used in internal mode
  evaluation_interval_ms: 250 # 250-1000 recommended; detector and live telemetry interval
  direct_api: true # Set false to disable Direct HTTP, SSE, raw CSI, and Direct mDNS discovery

# WiFi with fallback AP for provisioning
wifi:
  # ESP32-C5 defaults to AUTO when band_mode is omitted.
  ap:
    ssid: "ESPectre Fallback"

captive_portal:

# Improv provisioning via USB
improv_serial:
  next_url: "https://espectre.dev/tools/device-settings/?target={{ip_address}}"

# Logging
logger:
  level: INFO
  #hardware_uart: UART0  # Uncomment for boards with external USB-UART bridges (CH340, CP2102, etc.)

# Home Assistant API
api:

# OTA updates
ota:
  - platform: esphome
